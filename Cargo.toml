[package]
name = "firecraft"
version = "0.4.0"
edition = "2024"
description = "Real-time fire, smoke and explosion simulator with a node graph"
authors = ["Circuit Biscuit"]

[dependencies]
eframe = { version = "0.31", features = ["wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17"

[profile.dev]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[build-dependencies]
winresource = "0.1"
