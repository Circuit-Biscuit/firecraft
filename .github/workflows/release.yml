# Publishes a release automatically whenever the version in Cargo.toml goes up.
#
#   1. bump `version` in Cargo.toml (or run scripts/bump.ps1 0.5.0)
#   2. push to main
#   3. this workflow sees there's no tag v<version> yet, builds Windows, macOS and Linux
#      installers, and publishes them as GitHub release v<version> with checksums.
#
# Pushes that don't change the version do nothing here (ci.yml still builds and tests them).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$VERSION"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Windows installer
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    env:
      FIRECRAFT_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Build installer and portable zip
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\firecraft.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item target\release\firecraft.exe portable\FireCraft.exe
          Compress-Archive -Path portable\FireCraft.exe -DestinationPath "dist\FireCraft-$env:FIRECRAFT_VERSION-windows-x64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    name: macOS app (universal)
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: macos-14
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Bundle FireCraft.app and .dmg
        run: |
          APP=dist/FireCraft.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/FireCraft" \
            target/aarch64-apple-darwin/release/firecraft target/x86_64-apple-darwin/release/firecraft
          sed "s/__VERSION__/$V/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          mkdir FireCraft.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/logo.png --out FireCraft.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); [ $d -le 512 ] && sips -z $d $d assets/logo.png --out FireCraft.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns FireCraft.iconset -o "$APP/Contents/Resources/FireCraft.icns"
          codesign --force --deep --sign - "$APP"   # ad-hoc signature (required on Apple Silicon)
          mkdir dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "FireCraft $V" -srcfolder dmg -ov -format UDZO "dist/FireCraft-$V-macos-universal.dmg"
          rm -rf dmg "$APP"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  linux:
    name: Linux AppImage
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-22.04
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Tests (no GPU on build machines, so the GPU render tests are skipped)
        run: cargo test --release --locked -- --skip default_scene --skip gpu_
      - name: AppImage and tarball
        run: |
          mkdir -p dist AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps AppDir/usr/share/applications
          cp target/release/firecraft AppDir/usr/bin/
          cp packaging/linux/firecraft.desktop AppDir/ && cp packaging/linux/firecraft.desktop AppDir/usr/share/applications/
          cp assets/logo-256.png AppDir/firecraft.png && cp assets/logo-256.png AppDir/usr/share/icons/hicolor/256x256/apps/firecraft.png
          ln -s usr/bin/firecraft AppDir/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir "dist/FireCraft-$V-linux-x86_64.AppImage"
          tar czf "dist/FireCraft-$V-linux-x86_64.tar.gz" -C target/release firecraft
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  publish:
    name: Publish release
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        run: |
          # the "## [<version>]" section, up to the next "## [" heading
          awk -v v="$V" '/^## \[/{ if (on) exit; on = index($0, "[" v "]") > 0; next } on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section for $V" >&2; exit 1; fi
          printf '\n---\nDownloads: pick the file for your platform below. Check them with `SHA256SUMS.txt`.\n' >> notes.md
          cat notes.md
      - name: Create release v${{ env.V }}
        run: |
          gh release create "v$V" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "FireCraft $V" \
            --target "$GITHUB_SHA" \
            --notes-file notes.md
